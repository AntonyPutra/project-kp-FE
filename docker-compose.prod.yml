# ============================================================
# SICAMS - Docker Compose Production
# Server: Ubuntu + Docker + Cloudflare Tunnel
# Domain: sicams.whaleestudio.my.id | api.whaleestudio.my.id
# ============================================================

version: '3.9'

# ── Networks ───────────────────────────────────────────────
networks:
  sicams_network:
    driver: bridge
    name: sicams_network
  # Shared network for Cloudflare Tunnel access
  proxy_network:
    external: true
    name: proxy_network

# ── Volumes ────────────────────────────────────────────────
volumes:
  sicams_mysql_data:
    driver: local
    name: sicams_mysql_data
  sicams_redis_data:
    driver: local
    name: sicams_redis_data
  sicams_storage:
    driver: local
    name: sicams_storage
  sicams_logs:
    driver: local
    name: sicams_logs

# ── Services ───────────────────────────────────────────────
services:

  # ────────────────────────────────────────────────
  # FRONTEND - React + Vite + Nginx
  # Cloudflare Tunnel: sicams.whaleestudio.my.id → 192.168.1.3:5173
  # ────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: https://api.whaleestudio.my.id
        VITE_APP_NAME: SICAMS
    image: sicams-frontend:latest
    container_name: sicams_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    networks:
      - sicams_network
      - proxy_network
    environment:
      - TZ=Asia/Jakarta
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "com.sicams.service=frontend"
      - "com.sicams.version=${APP_VERSION:-1.0.0}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      backend:
        condition: service_healthy

  # ────────────────────────────────────────────────
  # BACKEND - Laravel 12 API Gateway
  # Cloudflare Tunnel: api.whaleestudio.my.id → 192.168.1.3:8000
  # ────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: sicams-backend:latest
    container_name: sicams_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - sicams_network
      - proxy_network
    volumes:
      - sicams_storage:/var/www/html/storage
      - sicams_logs:/var/www/html/storage/logs
    env_file:
      - ./backend/.env.production
    environment:
      - TZ=Asia/Jakarta
      - PHP_OPCACHE_ENABLE=1
      - PHP_OPCACHE_MEMORY=256
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "com.sicams.service=backend"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "10"

  # ────────────────────────────────────────────────
  # QUEUE WORKER - Laravel Queue (Notifications)
  # ────────────────────────────────────────────────
  queue:
    image: sicams-backend:latest
    container_name: sicams_queue
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--queue=notifications,default", "--tries=3", "--max-time=3600"]
    networks:
      - sicams_network
    volumes:
      - sicams_storage:/var/www/html/storage
      - sicams_logs:/var/www/html/storage/logs
    env_file:
      - ./backend/.env.production
    environment:
      - TZ=Asia/Jakarta
    depends_on:
      backend:
        condition: service_healthy
    labels:
      - "com.sicams.service=queue"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ────────────────────────────────────────────────
  # SCHEDULER - Laravel Task Scheduler (Cron)
  # ────────────────────────────────────────────────
  scheduler:
    image: sicams-backend:latest
    container_name: sicams_scheduler
    restart: unless-stopped
    command: ["/bin/sh", "-c", "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"]
    networks:
      - sicams_network
    volumes:
      - sicams_storage:/var/www/html/storage
    env_file:
      - ./backend/.env.production
    environment:
      - TZ=Asia/Jakarta
    depends_on:
      backend:
        condition: service_healthy
    labels:
      - "com.sicams.service=scheduler"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ────────────────────────────────────────────────
  # MYSQL - Database SICAMS (Port 3307 - avoid conflict with existing 3306)
  # ────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: sicams_mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    networks:
      - sicams_network
    volumes:
      - sicams_mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - ./docker/mysql/conf.d:/etc/mysql/conf.d:ro
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-SicamsRoot2026!}
      MYSQL_DATABASE: ${DB_DATABASE:-sicams_production}
      MYSQL_USER: ${DB_USERNAME:-sicams_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-SicamsDB2026!}
      TZ: Asia/Jakarta
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-SicamsRoot2026!}"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    labels:
      - "com.sicams.service=mysql"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ────────────────────────────────────────────────
  # REDIS - Cache & Queue (Port 6379)
  # ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sicams_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - sicams_network
    volumes:
      - sicams_redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass "${REDIS_PASSWORD:-SicamsRedis2026!}"
    environment:
      - TZ=Asia/Jakarta
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-SicamsRedis2026!}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - "com.sicams.service=redis"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ────────────────────────────────────────────────
  # NGINX REVERSE PROXY - Internal API Gateway
  # Routes requests within Docker network
  # ────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: sicams_nginx
    restart: unless-stopped
    networks:
      - sicams_network
      - proxy_network
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    labels:
      - "com.sicams.service=nginx"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ────────────────────────────────────────────────
  # ADMINER - Database Management (Internal Only)
  # Access via: http://192.168.1.3:9090
  # ────────────────────────────────────────────────
  adminer:
    image: adminer:4
    container_name: sicams_adminer
    restart: unless-stopped
    ports:
      - "9090:8080"
    networks:
      - sicams_network
    environment:
      ADMINER_DEFAULT_SERVER: mysql
      ADMINER_DESIGN: dracula
    depends_on:
      mysql:
        condition: service_healthy
    labels:
      - "com.sicams.service=adminer"
    profiles:
      - tools

  # ────────────────────────────────────────────────
  # BACKUP SERVICE - Scheduled MySQL Backup
  # ────────────────────────────────────────────────
  backup:
    image: mysql:8.0
    container_name: sicams_backup
    restart: unless-stopped
    networks:
      - sicams_network
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${DB_DATABASE:-sicams_production}
      MYSQL_USER: ${DB_USERNAME:-sicams_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-SicamsDB2026!}
      BACKUP_RETENTION_DAYS: 7
      TZ: Asia/Jakarta
    command: ["/bin/sh", "-c", "chmod +x /backup.sh && while true; do /backup.sh; sleep 86400; done"]
    depends_on:
      mysql:
        condition: service_healthy
    labels:
      - "com.sicams.service=backup"
    profiles:
      - backup
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
